<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Future Investment AI</title>
<style>
body{background:#0b1020;color:white;font-family:Arial,sans-serif;margin:0;padding:18px}
main{max-width:500px;margin:auto}
.card{background:#17233b;padding:20px;margin-bottom:16px;border-radius:14px}
h1{color:#30e0ae;text-align:center}
label{display:block;margin:12px 0 6px}
input{width:100%;padding:12px;box-sizing:border-box;background:#0b1020;color:white;border:1px solid #536582;border-radius:7px}
button{width:100%;padding:13px;margin-top:14px;background:#30e0ae;border:0;border-radius:7px;font-weight:bold}
#msg{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}
.small{line-height:1.8;color:#cbd5e1}
</style>
</head>
<body>
<main>
<section class="card">
<h1>Future Investment AI</h1>
<p class="small">مرحبًا بك في المنصة التجريبية. لا توجد معاملات مالية حقيقية.</p>
<p id="msg"></p>
</section>

<section class="card" id="reg">
<h2>إنشاء حساب</h2>
<form id="rf">
<label>الاسم</label><input name="name" required minlength="2">
<label>البريد الإلكتروني</label><input name="email" type="email" required>
<label>كلمة المرور (8 أحرف على الأقل)</label><input name="password" type="password" required minlength="8">
<label>كود الدعوة (اختياري)</label><input name="referralCode">
<button>إنشاء حساب</button>
</form>
</section>

<section class="card" id="log">
<h2>تسجيل الدخول</h2>
<form id="lf">
<label>البريد الإلكتروني</label><input name="email" type="email" required>
<label>كلمة المرور</label><input name="password" type="password" required>
<button>دخول</button>
</form>
</section>

<section class="card" id="account" hidden>
<h2>حسابك التجريبي</h2>
<p id="name"></p>
<p id="email"></p>
<p>كود الدعوة: <b id="code"></b></p>
<p>عدد الدعوات: <b id="count">0</b></p>
<p class="small">لا توجد إيداعات أو سحوبات أو أرباح حقيقية.</p>
<button type="button" id="logout">تسجيل الخروج</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
function msg(t){$('msg').textContent=t}
async function api(url,data,token){
 const opt={method:data?'POST':'GET',headers:{}};
 if(data){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(data)}
 if(token)opt.headers.Authorization='Bearer '+token;
 const r=await fetch(url,opt);
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(j.error||'حدث خطأ في الخادم');
 return j;
}
async function showAccount(token){
 const d=await api('/api/me',null,token);
 $('name').textContent='مرحبًا '+d.user.name;
 $('email').textContent=d.user.email;
 $('code').textContent=d.user.referralCode||'غير متوفر';
 $('count').textContent=d.referralCount??0;
 $('reg').hidden=true;
 $('log').hidden=true;
 $('account').hidden=false;
 msg('تم الدخول بنجاح.');
}

async function submit(event) {
  event.preventDefault();

  const form = event.currentTarget;
  const button = form.querySelector('button');
  const isRegister = form.id === 'rf';

  button.disabled = true;
  msg('جارٍ إنشاء الحساب...');

  const data = Object.fromEntries(new FormData(form).entries());

  try {
    const result = await api(
      isRegister ? '/api/register' : '/api/login',
      data
    );

    if (!result.token) {
      throw new Error('لم يتم إنشاء جلسة الدخول.');
    }

    localStorage.setItem('futureAI_demo_token', result.token);
    await showAccount(result.token);

    if (result.message) {
      msg(result.message);
    }
  } catch (error) {
    msg(error.message || 'حدث خطأ. حاول مرة أخرى.');
  } finally {
    button.disabled = false;
  }
}

$('rf').addEventListener('submit', submit);
$('lf').addEventListener('submit', submit);

$('logout').addEventListener('click', () => {
  localStorage.removeItem('futureAI_demo_token');
  $('account').hidden = true;
  $('reg').hidden = false;
  $('log').hidden = false;
  msg('تم تسجيل الخروج.');
});

(async () => {
  const token = localStorage.getItem('futureAI_demo_token');

  if (token) {
    try {
      await showAccount(token);
    } catch (error) {
      localStorage.removeItem('futureAI_demo_token');
      msg('سجّل الدخول مجددًا.');
    }
  }
})();
</script>
</body>
</html>
