<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Future Investment AI</title>

<style>
:root {
  --bg: #0b1020;
  --panel: #131f35;
  --panel2: #192944;
  --line: #2b3b58;
  --text: #f3f6fc;
  --muted: #aebbd0;
  --green: #30e0ae;
  --blue: #6da9ff;
  --red: #ff7c8b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(ellipse at top, #142544 0, #0b1020 60%);
  color: var(--text);
  font-family: Arial, Tahoma, sans-serif;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 12px 16px;
  font-weight: bold;
  background: var(--green);
  color: #07151b;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

button.secondary {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--line);
}

button.danger {
  background: #5a2635;
  color: white;
}

input {
  width: 100%;
  margin: 7px 0 15px;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #0b1629;
  color: white;
  outline: none;
}

input:focus {
  border-color: var(--green);
}

label {
  display: block;
  color: var(--muted);
  font-size: 14px;
}

.wrap {
  width: min(1150px, 100%);
  margin: auto;
  padding: 20px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, var(--green), var(--blue));
  color: #07151b;
  font-size: 23px;
  font-weight: 900;
}

.brand h1 {
  font-size: 19px;
  margin: 0;
}

.brand p {
  color: var(--muted);
  font-size: 12px;
  margin: 5px 0 0;
}

.pill, .badge {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 30px;
  padding: 7px 11px;
  color: var(--muted);
  font-size: 12px;
}

.card {
  background: linear-gradient(150deg, var(--panel2), var(--panel));
  border: 1px solid var(--line);
  border-radius:
    <body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <div class="logo">F</div>
    <div>
      <h1>Future Investment AI</h1>
      <p>مساحتك الرقمية في مكان واحد</p>
    </div>
  </div>
  <span class="pill" id="topStatus">مرحبًا بك</span>
</header>

<section id="authView" class="auth card">
  <div class="hero" style="padding:0 0 12px">
    <h2>أهلًا بك 👋</h2>
    <p>أنشئ حسابك أو سجّل الدخول للوصول إلى لوحة التحكم.</p>
  </div>

  <div class="switch">
    <button id="showLogin" class="active" type="button">
      تسجيل الدخول
    </button>
    <button id="showRegister" type="button">
      إنشاء حساب
    </button>
  </div>

  <form id="lf">
    <label>البريد الإلكتروني</label>
    <input name="email" type="email" autocomplete="email" required>

    <label>كلمة المرور</label>
    <input name="password" type="password"
           autocomplete="current-password" required>

    <button type="submit">دخول إلى حسابي</button>
  </form>

  <form id="rf" hidden>
    <label>الاسم الكامل</label>
    <input name="name" required minlength="2" maxlength="80">

    <label>البريد الإلكتروني</label>
    <input name="email" type="email" required autocomplete="email">

    <label>كلمة المرور (8 أحرف على الأقل)</label>
    <input name="password" type="password"
           minlength="8" required autocomplete="new-password">

    <label>كود الدعوة (اختياري)</label>
    <input name="referralCode" autocomplete="off">

    <button type="submit">إنشاء حساب</button>
  </form>

  <p id="authMsg" class="msg" role="status"></p>
</section>

<div id="appView" hidden>
  <div class="layout">

    <aside class="card side">
      <div class="row">
        <div>
          <strong id="sideName">حسابي</strong>
          <div id="sideEmail" class="small"></div>
        </div>
        <span class="badge">الحساب</span>
      </div>

      <nav class="nav" id="nav">
        <button class="active" data-page="home" type="button">
          🏠 الرئيسية
        </button>
        <button data-page="packages" type="button">
          📦 الباقات
        </button>
        <button data-page="profile" type="button">
          👤 الملف الشخصي
        </button>
        <button data-page="referrals" type="button">
          🤝 الدعوات
        </button>
        <button data-page="admin" type="button">
          🛡️ الإدارة
        </button>
      </nav>

      <button id="logout" class="danger"
              style="width:100%;margin-top:16px" type="button">
        تسجيل الخروج
      </button>
    </aside>

    <main>

      <section class="section active" id="page-home">
        <div class="card hero">
          <span class="badge">لوحة التحكم</span>
          <h2 id="welcome">مرحبًا بك</h2>
          <p>تابع بيانات حسابك وإحالاتك من مكان واحد.</p>
        </div>

        <div class="stats">
          <div class="stat">
            <small>حالة الحساب</small>
            <strong>مسجل</strong>
          </div>
          <div class="stat">
            <small>عدد الدعوات</small>
            <strong id="homeCount">0</strong>
          </div>
          <div class="stat">
            <small>كود الدعوة</small>
            <strong id="homeCode">—</strong>
          </div>
        </div>

        <div class="card">
          <h3>اختصارات</h3>
          <div class="grid">
            <button data-go="packages" type="button">عرض الباقات</button>
            <button class="secondary" data-go="referrals" type="button">
              إدارة الدعوات
            </button>
            <button class="secondary" data-go="profile" type="button">
              بيانات حسابي
            </button>
          </div>
        </div>

        <div class="notice">
          الباقات معلومات تعريفية فقط. لا يتم تنفيذ إيداعات أو سحوبات أو
          استثمارات فعلية من هذه الواجهة.
        </div>
      </section>

      <section class="section" id="page-packages">
        <div class="card hero">
          <h2>📦 الباقات</h2>
          <p>الباقات المعروضة للتعريف فقط.</p>
        </div>

        <div class="grid">
          <div class="card package">
            <h3>الباقة الأولى</h3>
            <h2>5,000 دج</h2>
            <p class="muted">تفاصيل الباقة</p>
          </div>

          <div class="card package">
            <h3>الباقة الثانية</h3>
            <h2>7,000 دج</h2>
            <p class="muted">تفاصيل الباقة</p>
          </div>

          <div class="card package">
            <h3>الباقة الثالثة</h3>
            <h2>10,000 دج</h2>
            <p class="muted">تفاصيل الباقة</p>
          </div>

          <div class="card package">
            <h3>الباقة الرابعة</h3>
            <h2>20,000 دج</h2>
            <p class="muted">تفاصيل الباقة</p>
          </div>

          <div class="card package">
            <h3>الباقة الخامسة</h3>
            <h2>50,000 دج</h2>
            <p class="muted">تفاصيل الباقة</p>
          </div>

          <div class="card package">
            <h3>الباقة السادسة</h3>
            <h2>70,000 دج</h2>
            <p class="muted">تفاصيل الباقة</p>
          </div>

          <div class="card package">
            <h3>الباقة السابعة</h3>
            <h2>100,000 دج</h2>
            <p class="muted">تفاصيل الباقة</p>
          </div>
        </div>

        <div class="notice">
          لا يوجد دفع أو استثمار فعلي مفعّل في هذه الصفحة.
        </div>
      </section>

      <section class="section" id="page-profile">
        <div class="card hero">
          <h2>👤 الملف الشخصي</h2>
          <p>معلومات حسابك المسجل.</p>
        </div>

        <div class="card">
          <p>الاسم: <strong id="profileName">—</strong></p>
          <p>البريد الإلكتروني: <strong id="profileEmail">—</strong></p>
          <p>كود الدعوة: <strong id="profileCode">—</strong></p>
          <p id="profileMsg" class="msg"></p>
          <button id="refreshProfile" type="button">
            تحديث البيانات
          </button>
        </div>
      </section>

      <section class="section" id="page-referrals">
        <div class="card hero">
          <h2>🤝 الدعوات</h2>
          <p>كود الدعوة وقائمة الإحالات المرتبطة بحسابك.</p>
        </div>

        <div class="card">
          <label for="referralDisplay">كود الدعوة الخاص بك</label>
          <input id="referralDisplay" readonly>
          <button id="copyReferral" type="button">نسخ كود الدعوة</button>
          <p id="referralMsg" class="msg"></p>
        </div>

        <div class="card">
          <h3>قائمة الإحالات</h3>
          <div id="referralList" class="muted">
            اضغط على تحديث الإحالات.
          </div>
          <button id="refreshReferrals" type="button">
            تحديث الإحالات
          </button>
        </div>
      </section>

      <section class="section" id="page-admin">
        <div class="card hero">
          <h2>🛡️ لوحة الإدارة</h2>
          <p>للمسؤول المخوّل فقط.</p>
        </div>

        <div class="card">
          <label for="adminKey">مفتاح الإدارة</label>
          <input id="adminKey" type="password" autocomplete="off">

          <button id="loadUsers" type="button">عرض المستخدمين</button>
          <p id="adminMsg" class="msg" role="status"></p>
          <div id="adminUsers"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<footer>Future Investment AI</footer>
</div>
  <script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const TOKEN_KEY = "futureAI_demo_token";

  let currentUser = null;

  function token() {
    return localStorage.getItem(TOKEN_KEY);
  }

  function message(id, text) {
    const el = $(id);
    if (el) el.textContent = text || "";
  }

  async function api(path, options = {}) {
    const headers = {
      ...(options.headers || {})
    };

    if (options.body) {
      headers["Content-Type"] = "application/json";
    }

    if (token()) {
      headers.Authorization = "Bearer " + token();
    }

    const response = await fetch(path, {
      ...options,
      headers
    });

    let data = {};

    try {
      data = await response.json();
    } catch (_) {}

    if (!response.ok) {
      throw new Error(
        data.message || data.error || "حدث خطأ أثناء الاتصال بالخادم."
      );
    }

    return data;
  }

  function showAuth(text = "") {
    $("authView").hidden = false;
    $("appView").hidden = true;
    $("topStatus").textContent = "مرحبًا بك";
    message("authMsg", text);
  }

  function showPage(name) {
    document.querySelectorAll(".section").forEach(section => {
      section.classList.toggle(
        "active",
        section.id === "page-" + name
      );
    });

    document.querySelectorAll("[data-page]").forEach(button => {
      button.classList.toggle("active", button.dataset.page === name);
    });
  }

  function renderUser() {
    if (!currentUser) return;

    const name = currentUser.name || "مستخدم";
    const email = currentUser.email || "—";
    const code = currentUser.referralCode ||
                 currentUser.referral_code || "—";

    $("sideName").textContent = name;
    $("sideEmail").textContent = email;
    $("welcome").textContent = "مرحبًا بك، " + name;

    $("profileName").textContent = name;
    $("profileEmail").textContent = email;
    $("profileCode").textContent = code;
    $("homeCode").textContent = code;
    $("referralDisplay").value = code === "—" ? "" : code;
  }

  async function enterApp(user) {
    currentUser = user || null;

    if (!currentUser) {
      const data = await api("/api/me");
      currentUser = data.user || data;
    }

    $("authView").hidden = true;
    $("appView").hidden = false;
    $("topStatus").textContent = "مسجل الدخول";

    renderUser();
    showPage("home");
  }

  $("showLogin").addEventListener("click", () => {
    $("lf").hidden = false;
    $("rf").hidden = true;

    $("showLogin").classList.add("active");
    $("showRegister").classList.remove("active");

    message("authMsg", "");
  });

  $("showRegister").addEventListener("click", () => {
    $("lf").hidden = true;
    $("rf").hidden = false;

    $("showRegister").classList.add("active");
    $("showLogin").classList.remove("active");

    message("authMsg", "");
  });

  $("lf").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("lf").querySelector('button[type="submit"]');
    button.disabled = true;
    message("authMsg", "جارٍ تسجيل الدخول...");

    const form = new FormData(event.currentTarget);

    try {
      const data = await api("/api/login", {
        method: "POST",
        body: JSON.stringify({
          email: String(form.get("email")).trim(),
          password: form.get("password")
        })
      });

      if (!data.token) {
        throw new Error("الخادم لم يُرجع رمز الدخول.");
      }

      localStorage.setItem(TOKEN_KEY, data.token);
      await enterApp(data.user);

      message("authMsg", "");

    } catch (error) {
      message("authMsg", error.message);
    } finally {
      button.disabled = false;
    }
  });

  $("rf").addEventListener("submit", async event => {
    event.preventDefault();

    const button = $("rf").querySelector('button[type="submit"]');
    button.disabled = true;
    message("authMsg", "جارٍ إنشاء الحساب...");

    const form = new FormData(event.currentTarget);

    try {
      const data = await api("/api/register", {
        method: "POST",
        body: JSON.stringify({
          name: String(form.get("name")).trim(),
          email: String(form.get("email")).trim(),
          password: form.get("password"),
          referralCode: String(form.get("referralCode") || "").trim()
        })
      });

      if (!data.token) {
        throw new Error(
          data.message || "لم يُرجع الخادم رمز الدخول."
        );
      }

      localStorage.setItem(TOKEN_KEY, data.token);
      await enterApp(data.user);

      message("authMsg", "");

    } catch (error) {
      message("authMsg", error.message);
    } finally {
      button.disabled = false;
    }
  });

  async function refreshProfile() {
    message("profileMsg", "جارٍ تحديث البيانات...");

    try {
      const data = await api("/api/me");
      currentUser = data.user || data;
      renderUser();
      message("profileMsg", "تم تحديث بيانات الحساب.");
    } catch (error) {
      message("profileMsg", error.message);
    }
  }

  async function refreshReferrals() {
    message("referralMsg", "جارٍ تحميل الإحالات...");
    $("referralList").textContent = "جارٍ التحميل...";

    try {
      const data = await api("/api/referrals");

      const referrals = Array.isArray(data)
        ? data
        : (data.referrals || data.users || []);

      $("homeCount").textContent = String(referrals.length);
      $("referralList").replaceChildren();

      if (referrals.length === 0) {
        $("referralList").textContent =
          "لا توجد إحالات لعرضها حاليًا.";
      } else {
        const list = document.createElement("ul");

        referrals.forEach(user => {
          const item = document.createElement("li");
          item.textContent = user.name || user.email || "مستخدم";
          list.appendChild(item);
        });

        $("referralList").appendChild(list);
      }

      message("referralMsg", "تم تحديث الإحالات.");

    } catch (error) {
      $("referralList").textContent = "تعذر تحميل الإحالات.";
      message("referralMsg", error.message);
    }
  }

  $("refreshProfile").addEventListener("click", refreshProfile);
  $("refreshReferrals").addEventListener("click", refreshReferrals);

  $("copyReferral").addEventListener("click", async () => {
    const code = $("referralDisplay").value;

    if (!code) {
      message("referralMsg", "لا يوجد كود دعوة لنسخه.");
      return;
    }

    try {
      await navigator.clipboard.writeText(code);
      message("referralMsg", "تم نسخ كود الدعوة.");
    } catch (_) {
      $("referralDisplay").select();
      message("referralMsg", "حدد الكود وانسخه يدويًا.");
    }
  });

  document.querySelectorAll("[data-page]").forEach(button => {
    button.addEventListener("click", () => {
      const page = button.dataset.page;
      showPage(page);

      if (page === "profile") refreshProfile();
      if (page === "referrals") refreshReferrals();
    });
  });

  document.querySelectorAll("[data-go]").forEach(button => {
    button.addEventListener("click", () => {
      showPage(button.dataset.go);
    });
  });

  $("logout").addEventListener("click", () => {
    localStorage.removeItem(TOKEN_KEY);
    currentUser = null;

    $("lf").reset();
    $("rf").reset();

    showAuth("تم تسجيل الخروج.");
  });

  $("loadUsers").addEventListener("click", async () => {
    const key = $("adminKey").value.trim();

    if (!key) {
      message("adminMsg", "أدخل مفتاح الإدارة أولًا.");
      return;
    }

    message("adminMsg", "جارٍ تحميل البيانات...");
    $("adminUsers").replaceChildren();

    try {
      const data = await api("/api/admin/users", {
        headers: {
          "x-admin-key": key
        }
      });

      const users = Array.isArray(data)
        ? data
        : (data.users || []);

      if (!users.length) {
        $("adminUsers").textContent = "لا توجد بيانات للعرض.";
      } else {
        const table = document.createElement("table");
        const head = document.createElement("tr");

        ["الاسم", "البريد الإلكتروني"].forEach(label => {
          const th = document.createElement("th");
          th.textContent = label;
          head.appendChild(th);
        });

        table.appendChild(head);

        users.forEach(user => {
          const row = document.createElement("tr");

          [user.name || "—", user.email || "—"].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });

          table.appendChild(row);
        });

        $("adminUsers").appendChild(table);
      }

      message("adminMsg", "تم تحميل البيانات.");

    } catch (error) {
      message("adminMsg", error.message);
    }
  });

  async function start() {
    if (!token()) {
      showAuth();
      return;
    }

    try {
      const data = await api("/api/me");
      await enterApp(data.user || data);
    } catch (_) {
      localStorage.removeItem(TOKEN_KEY);
      showAuth("تعذر التحقق من الجلسة. سجّل الدخول مجددًا.");
    }
  }

  start();
})();
</script>
</body>
</html>
